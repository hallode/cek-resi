# Model dan effort tiap peran agen: satu-satunya tempat untuk mengubahnya.
# Setelah mengubah: `mise run agents:sync` (menulis ke .claude/agents/<peran>.md).
# `mise run lint` gagal kalau berkas agen tidak sesuai dengan config ini.
#
# model : opus | sonnet | haiku | fable | inherit | ID model lengkap (mis. claude-opus-5-5)
# effort: low | medium | high | xhigh | max
#
# Pembagian (mengikuti context-circuit, role-tiering.yaml): planner dijalankan sekali per
# tugas dan semua langkah berikutnya mewarisi kesalahannya; reviewer harus menangkap apa
# yang sudah diyakini benar oleh model lain. Keduanya layak mendapat model terkuat. Executor
# memakai token paling banyak; explorer banyak tapi dangkal. Reviewer dari keluarga model
# yang berbeda dengan executor punya titik buta yang berbeda pula.

[defaults]
effort = "high"

[planner]
model = "opus"

[executor]
model = "sonnet"

[reviewer]
model = "opus"

[explorer]
model = "sonnet"
